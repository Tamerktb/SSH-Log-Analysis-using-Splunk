# 03 - SSH - Credential Stuffing
#
# Splunk search this mirrors (default/savedsearches.conf):
#   index=linux_secure ("Failed password" OR "Invalid user" OR "authentication failure")
#   | `ssh_allowlist_filter(src_ip)`
#   | stats dc(target_user) as unique_users count as attempts by src_ip
#   | where unique_users >= 15 AND attempts >= 20
#   | `ssh_ti_enrich(src_ip)`
#   schedule */2 * * * *  window -2m  severity 4  suppress src_ip 2h
name: SSH - Credential Stuffing
type: ssh_ruletypes.SshCredentialStuffing

index: filebeat-*
timestamp_field: "@timestamp"

timeframe:
  minutes: 2

group_by:
  - source.ip
distinct_key: user.name
min_distinct: 15
min_count: 20

query_key: source.ip
realert:
  hours: 2

filter:
  - term:
      event.module: sshloganalysis
  - terms:
      event.action: [ssh_login_failed, ssh_pam_failure]
  # `ssh_allowlist_filter(src_ip)`
  - bool:
      must_not:
        - exists:
            field: allow_reason

alert:
  - debug
alert_subject: "SSH credential stuffing - {0} across {1} accounts"
alert_subject_args:
  - source.ip
  - distinct_count
alert_text: |
  Credential stuffing: {0} hit {1} distinct accounts over {2} failed logins in the
  last 2 minutes. Thresholds: {3}
  Accounts targeted (first 50): {4}
alert_text_args:
  - source.ip
  - distinct_count
  - event_count
  - threshold
  - distinct_values

severity: MEDIUM
splunk_severity: 4
detection: credential_stuffing
mitre: T1110.004
owner: soc
