###############################################################################
# Search macros - single source of truth for base searches and enrichment.
# Correlation searches in savedsearches.conf call these instead of repeating
# index/sourcetype/lookup plumbing.
###############################################################################

[ssh_events]
# Base: where SSH auth logs live. Change the index here once to retarget all
# searches, dashboards and macros.
definition = index=linux_secure sourcetype=linux_secure
iseval = 0

[ssh_failed_logins]
definition = `ssh_events` ("Failed password" OR "Invalid user" OR "authentication failure")
iseval = 0

[ssh_accepted_logins]
definition = `ssh_events` ("Accepted password" OR "Accepted publickey" OR "Accepted keyboard-interactive")
iseval = 0

[ssh_allowlist_filter(ip_field)]
# Drops sources covered by lookups/ssh_allowlist.csv (internal / VPN / CI).
definition = lookup ssh_allowlist.csv $ip_field$ OUTPUT allow_reason | where isnull(allow_reason)
iseval = 0

[ssh_ti_enrich(ip_field)]
# Enriches with the LIVE feeds written by scripts/update_threat_intel.py:
#   Tor bulk exit list, abuse.ch Feodo+SSLBL C2 blocklists, Spamhaus DROP.
# Output field: threat_intel = TOR_EXIT | C2_BLOCKLIST | SPAMHAUS_DROP | ""
definition = lookup tor_exit_nodes.csv $ip_field$ OUTPUT tor_node_source | lookup c2_blocklist.csv $ip_field$ OUTPUT c2_source | lookup spamhaus_drop.csv $ip_field$ OUTPUT sbl_reference | eval threat_intel = if(isnotnull(tor_node_source), "TOR_EXIT", if(isnotnull(c2_source), "C2_BLOCKLIST", if(isnotnull(sbl_reference), "SPAMHAUS_DROP", "")))
iseval = 0

[ssh_watchlist_enrich(ip_field)]
# Internal analyst watchlist - rows are added by the SOC, not by a feed.
definition = lookup known_attackers.csv $ip_field$ OUTPUT threat_type, confidence AS ti_confidence, source AS ti_source | eval watchlist_hit = if(isnotnull(threat_type), threat_type, "")
iseval = 0
