###############################################################################
# App manifest - SSH Log Analysis
# Package id MUST match the app directory name (SSHLogAnalysis).
# Deploy as: $SPLUNK_HOME/etc/apps/SSHLogAnalysis/
###############################################################################

[install]
is_configured = 0
state = enabled

[package]
id = SSHLogAnalysis
check_for_updates = 0

[ui]
is_visible = 1
label = SSH Log Analysis

[launcher]
author = Tamer Alkhatib
description = SSH brute-force, credential-stuffing and account-anomaly detection.
description = CIM-tagged authentication events, scheduled correlation searches and live threat-intel feeds.
version = 1.0.0
