###############################################################################
# CIM tags - the Authentication data model requires action::success,
# action::failure and app::ssh on the event types defined in eventtypes.conf.
###############################################################################

[eventtype=ssh_login_success]
action = success
app = ssh
protocol = ssh

[eventtype=ssh_login_failure]
action = failure
app = ssh
protocol = ssh

[eventtype=ssh_login_invalid_user]
action = failure
app = ssh
protocol = ssh

[eventtype=ssh_auth_failure_pam]
action = failure
app = ssh
protocol = ssh

[eventtype=ssh_sudo]
action = success
app = ssh
protocol = ssh
