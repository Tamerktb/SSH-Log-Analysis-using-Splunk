###############################################################################
# Splunk Props Configuration - SSH authentication (sourcetype = linux_secure)
# App-scoped path: etc/apps/SSHLogAnalysis/default/props.conf
#
# Parsing is self-contained so the app works without Splunk_TA_nix. If the
# official add-on IS installed it owns base parsing for linux_secure; the CIM
# mapping below is additive and safe either way.
###############################################################################

[linux_secure]
# One consistent line-breaking strategy (no BREAK_ONLY_BEFORE contradiction).
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000

# Traditional syslog timestamp: "Jun 10 08:15:01"
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 32
# Set to the log source's timezone (e.g. Africa/Amman) for correct _time.
TZ = UTC

# Free-text syslog lines -> no automatic key/value extraction.
KV_MODE = none
AUTO_KV_JSON = false

# Field extraction (definitions live in transforms.conf).
REPORT-ssh_fields = ssh_event_types, ssh_cim_extract

# CIM Authentication mapping. The Authentication data model auto-lookup
# requires: src, user, dest, action, app, vendor_product.
EXTRACT-msg_host = ^\S+\s+\d+\s+\d{2}:\d{2}:\d{2}\s+(?<msg_host>\S+)
EVAL-action = case(match(_raw, "Accepted"), "success", match(_raw, "Failed password|Invalid user|authentication failure"), "failure")
EVAL-app = "sshd"
EVAL-vendor_product = "OpenSSH sshd"
EVAL-dest = coalesce(msg_host, host)

[linux_secure:search]
# Search-time extraction, only evaluated when referenced.
REPORT-ssh_search_extract = ssh_search_fields
