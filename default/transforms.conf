###############################################################################
# Splunk Transforms Configuration - SSH field extraction & lookup definitions
# App-scoped path: etc/apps/SSHLogAnalysis/default/transforms.conf
#
# - No invalid keys (the original used LOOKUP_METHOD / EXTRACT_output, which
#   are not transforms.conf settings).
# - Geo enrichment uses the built-in `iplocation` command, not a "geoip"
#   lookup that never existed.
# - Lookup definitions here resolve every CSV the searches reference.
###############################################################################

# === Field extractions ===

[ssh_event_types]
# Classifies the syslog SSH event type.
REGEX = (Failed password|Accepted password|Invalid user|Connection closed|Disconnected from|break-in attempt)
FORMAT = ssh_event_type::$1

[ssh_cim_extract]
# CIM Authentication fields: user, src, src_port (named captures => no FORMAT).
# NOTE: Splunk rejects duplicate named capture groups within one REGEX
# (the pattern silently matches nothing). So the "Invalid user" form lives in
# its own stanza below instead of a second alternation branch.
REGEX = (?<cim_outcome>Failed|Accepted)\s+\S+\s+for\s+(?:invalid user\s+)?(?<user>\S+)\s+from\s+(?<src>\S+)(?:\s+port\s+(?<src_port>\d+))?

[ssh_cim_invalid]
# Plain "Invalid user <u> from <ip>" lines (no outcome verb).
REGEX = Invalid user\s+(?<user>\S+)\s+from\s+(?<src>\S+)(?:\s+port\s+(?<src_port>\d+))?

[ssh_search_fields]
REGEX = (?<usage_detail>(?:Failed|Accepted)\s+(?:password|publickey|keyboard-interactive)\s+for\s+\S+\s+from\s+\S+\s+port\s+\d+\s+ssh2)

# === CSV lookup definitions ===
# Files live in this app's lookups/ directory; no manual upload required when
# the app is installed as a package.

[known_attackers]
filename = known_attackers.csv
case_sensitive_match = false

[ssh_policy_violations]
filename = ssh_policy_violations.csv
case_sensitive_match = false

[tor_exit_nodes]
filename = tor_exit_nodes.csv
case_sensitive_match = false

[c2_blocklist]
filename = c2_blocklist.csv
case_sensitive_match = false

[ssh_allowlist]
filename = ssh_allowlist.csv
case_sensitive_match = false

# Spamhaus DROP is published as CIDR ranges -> CIDR matching, not exact.
[spamhaus_drop]
filename = spamhaus_drop.csv
case_sensitive_match = false
match_type = CIDR(src_ip)
