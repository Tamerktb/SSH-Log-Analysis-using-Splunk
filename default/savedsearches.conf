###############################################################################
# SSH correlation searches - scheduled, CIM-aware, macro-driven.
# App-scoped path: etc/apps/SSHLogAnalysis/default/savedsearches.conf
#
# Base searches come from default/macros.conf (`ssh_events`, `ssh_failed_logins`,
# `ssh_accepted_logins`, `ssh_allowlist_filter`, `ssh_ti_enrich`).
# Replace soc@example.com with your real distribution list / on-call alias.
###############################################################################

[SSH - Brute Force Detection]
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 1h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Brute force from $result.src_ip$
action.email.format = table
action.email.sendresults = 1
description = 10+ failed SSH logins from one source IP in 5 minutes (MITRE T1110).
search = `ssh_failed_logins` \
  | rex field=_raw "Failed password for (?:invalid user )?(?<target_user>\S+) from (?<src_ip>\S+)" \
  | stats count by src_ip, target_user \
  | where count >= 10 \
  | `ssh_allowlist_filter(src_ip)` \
  | `ssh_ti_enrich(src_ip)` \
  | iplocation src_ip \
  | eval severity = "HIGH", detection = "brute_force", risk_score = count * 5 \
  | table src_ip, target_user, count, City, Country, threat_intel, severity, detection, risk_score

[SSH - Distributed Brute Force Detection]
disabled = 0
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = target_user
alert.suppress.period = 2h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Distributed brute force against $result.target_user$
action.email.format = table
action.email.sendresults = 1
description = Many source IPs targeting a single account - botnet / password-spray (MITRE T1110.003).
search = `ssh_failed_logins` \
  | rex field=_raw "Failed password for (?:invalid user )?(?<target_user>\S+) from (?<src_ip>\S+)" \
  | stats dc(src_ip) as src_count count as attempts by target_user \
  | where src_count >= 8 AND attempts >= 20 \
  | eval severity = "HIGH", detection = "distributed_brute_force" \
  | table target_user, src_count, attempts, severity, detection

[SSH - Credential Stuffing Detection]
disabled = 0
enableSched = 1
cron_schedule = */2 * * * *
dispatch.earliest_time = -2m
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 2h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Credential stuffing from $result.src_ip$
action.email.format = table
action.email.sendresults = 1
description = 15+ distinct usernames tried from one source IP in 2 minutes (MITRE T1110.004).
search = `ssh_failed_logins` \
  | rex field=_raw "(?:Failed password for (?:invalid user )?|Invalid user )(?<target_user>\S+) from (?<src_ip>\S+)" \
  | stats dc(target_user) as unique_users count as attempts by src_ip \
  | where unique_users >= 15 AND attempts >= 20 \
  | `ssh_allowlist_filter(src_ip)` \
  | `ssh_ti_enrich(src_ip)` \
  | iplocation src_ip \
  | eval severity = "CRITICAL", detection = "credential_stuffing" \
  | table src_ip, unique_users, attempts, City, Country, threat_intel, severity, detection

[SSH - Successful Brute Force (possible compromise)]
disabled = 0
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 4h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] POSSIBLE BREACH - $result.src_ip$ -> $result.target_user$
action.email.format = table
action.email.sendresults = 1
description = An accepted SSH login preceded by repeated failures from the same source (MITRE T1078/T1110).
search = `ssh_events` ("Failed password" OR "Accepted password") \
  | rex field=_raw "(?<outcome>Failed password|Accepted password) for (?:invalid user )?(?<target_user>\S+) from (?<src_ip>\S+)" \
  | eval is_fail = if(outcome == "Failed password", 1, 0), is_success = if(outcome == "Accepted password", 1, 0) \
  | stats sum(is_fail) as failed_count sum(is_success) as success_count by src_ip, target_user \
  | where failed_count >= 5 AND success_count > 0 \
  | `ssh_allowlist_filter(src_ip)` \
  | `ssh_ti_enrich(src_ip)` \
  | iplocation src_ip \
  | eval severity = "CRITICAL", detection = "brute_force_success", risk_score = failed_count * 10 \
  | table src_ip, target_user, failed_count, success_count, City, Country, threat_intel, risk_score, severity, detection

[SSH - Impossible Travel]
disabled = 0
enableSched = 1
cron_schedule = 0 */2 * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 4h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Impossible travel for $result.user$
action.email.format = table
action.email.sendresults = 1
description = Same account logs in from two locations that are impossible to reach in the elapsed time (MITRE T1078).
search = `ssh_accepted_logins` \
  | rex field=_raw "Accepted \S+ for (?<user>\S+) from (?<src>\S+)" \
  | iplocation src \
  | where isnotnull(lat) \
  | sort 0 user +_time \
  | streamstats current=f window=1 last(_time) as prev_time last(lat) as prev_lat last(lon) as prev_lon by user \
  | eval hours = round((_time - prev_time) / 3600, 2) \
  | eval distance_km = round(6371 * 2 * asin(sqrt(pow(sin(((lat - prev_lat) * pi() / 180) / 2), 2) + cos(prev_lat * pi() / 180) * cos(lat * pi() / 180) * pow(sin(((lon - prev_lon) * pi() / 180) / 2), 2))), 1) \
  | eval speed_kmh = if(hours > 0, round(distance_km / hours, 1), null()) \
  | where distance_km > 500 AND (isnull(hours) OR speed_kmh > 900) \
  | eval severity = "HIGH", detection = "impossible_travel" \
  | table _time, user, src, prev_lat, prev_lon, lat, lon, City, Country, distance_km, hours, speed_kmh, severity, detection

[SSH - Off-Hours Login]
disabled = 0
enableSched = 1
cron_schedule = 0 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 2
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 8h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Off-hours logins for $result.user$
action.email.format = table
action.email.sendresults = 1
description = Successful SSH logins outside business hours (before 06:00 or after 22:00 local).
search = `ssh_accepted_logins` \
  | rex field=_raw "Accepted \S+ for (?<user>\S+) from (?<src>\S+)" \
  | eval hour = tonumber(strftime(_time, "%H")) \
  | where hour < 6 OR hour >= 22 \
  | `ssh_allowlist_filter(src)` \
  | iplocation src \
  | stats count values(src) as sources values(City) as cities by user, hour \
  | where count >= 3 \
  | eval severity = "MEDIUM", detection = "off_hours_login" \
  | table user, hour, count, sources, cities, severity, detection

[SSH - Dormant Account Login]
disabled = 0
enableSched = 1
cron_schedule = 0 */6 * * *
dispatch.earliest_time = -7d
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 24h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Dormant account just logged in - $result.user$
action.email.format = table
action.email.sendresults = 1
description = An account whose first successful login in the last 7 days happened in the last 15 minutes (dormant/service account re-use).
search = `ssh_accepted_logins` \
  | rex field=_raw "Accepted \S+ for (?<user>\S+) from (?<src>\S+)" \
  | stats earliest(_time) as first_time count values(src) as sources by user \
  | where first_time > relative_time(now(), "-15m") \
  | `ssh_allowlist_filter(sources)` \
  | eval severity = "MEDIUM", detection = "dormant_account_login", first_login = strftime(first_time, "%Y-%m-%d %H:%M:%S") \
  | table user, first_login, count, sources, severity, detection

[SSH - Threat Intel Match]
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 4h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Threat-intel hit - $result.src_ip$ ($result.threat_intel)
action.email.format = table
action.email.sendresults = 1
description = SSH activity from an IP on the live Tor-exit / abuse.ch C2 / Spamhaus DROP feeds.
search = `ssh_events` ("Accepted password" OR "Failed password" OR "Invalid user") \
  | rex field=_raw "(?<outcome>Accepted|Failed) \S+(?: for)?(?: invalid user)? (?<user>\S+) from (?<src_ip>\S+)" \
  | `ssh_ti_enrich(src_ip)` \
  | where threat_intel != "" \
  | iplocation src_ip \
  | stats count values(threat_intel) as intel values(user) as users by src_ip, City, Country \
  | eval severity = "HIGH", detection = "threat_intel_match" \
  | table src_ip, intel, count, users, City, Country, severity, detection

[SSH - Privileged Account Login]
disabled = 0
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
is_scheduled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 4h
alert.track = 1
action.email = 0
action.email.to = soc@example.com
action.email.subject = [SSH] Privileged login - $result.user$ from $result.src$
action.email.format = table
action.email.sendresults = 1
description = Direct SSH login to a privileged / service account (root, admin, svc_*).
search = `ssh_accepted_logins` \
  | rex field=_raw "Accepted \S+ for (?<user>\S+) from (?<src>\S+)" \
  | where user IN ("root", "admin", "administrator", "ubuntu", "ec2-user") OR match(user, "^svc_") \
  | `ssh_allowlist_filter(src)` \
  | `ssh_ti_enrich(src)` \
  | iplocation src \
  | eval severity = "HIGH", detection = "privileged_login" \
  | table _time, user, src, City, Country, threat_intel, severity, detection
