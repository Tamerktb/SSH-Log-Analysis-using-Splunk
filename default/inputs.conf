###############################################################################
# Splunk Universal Forwarder Inputs Configuration
# Place in: $SPLUNK_HOME/etc/system/local/inputs.conf
#
# Monitors SSH authentication logs for real-time ingestion.
# Tested paths: Ubuntu/Debian (auth.log), RHEL/CentOS/Rocky (secure)
#
# FIX vs original: removed the invalid `[default] host = $decideOnStartup`
# stanza (that is not a valid inputs.conf directive). Set the host/forwarder
# name on the forwarder itself, or via `splunk set default-hostname <name>`.
###############################################################################

[monitor:///var/log/auth.log]
disabled = 0
index = linux_secure
sourcetype = linux_secure
crcSalt = <SOURCE>
followTail = 0

[monitor:///var/log/secure]
disabled = 0
index = linux_secure
sourcetype = linux_secure
crcSalt = <SOURCE>
followTail = 0

# Optional: general syslog / messages (disabled by default)
[monitor:///var/log/syslog]
disabled = 1
index = linux_syslog
sourcetype = syslog
crcSalt = <SOURCE>
followTail = 0

[monitor:///var/log/messages]
disabled = 1
index = linux_messages
sourcetype = syslog
crcSalt = <SOURCE>
followTail = 0

# ---------------------------------------------------------------------------
# Threat-intel feed refresh (runs on the search head, once a day).
# Enable this to keep lookups/tor_exit_nodes.csv, c2_blocklist.csv and
# spamhaus_drop.csv current without an external cron job. The script writes
# into the app's lookups/ directory; Splunk picks the new CSV up on the next
# lookup execution. Set disabled = 0 to turn it on.
#
# The path is app-relative: ./bin/ resolves to
# $SPLUNK_HOME/etc/apps/<app>/bin/ , which is where Splunk expects scripts it
# executes. That keeps the stanza portable if the app folder is renamed.
# ---------------------------------------------------------------------------
[script://./bin/update_threat_intel.py]
disabled = 1
interval = 86400
sourcetype = ssh_threat_intel_update
index = _internal

