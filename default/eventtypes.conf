###############################################################################
# Event types for SSH authentication (Splunk_TA_nix / CIM Authentication style)
# Tags in tags.conf then mark these action::success / action::failure /
# app::ssh so the CIM Authentication data model and ES notable tracking work.
###############################################################################

[ssh_login_success]
search = sourcetype=linux_secure ("Accepted password" OR "Accepted publickey" OR "Accepted keyboard-interactive")

[ssh_login_failure]
search = sourcetype=linux_secure "Failed password"

[ssh_login_invalid_user]
search = sourcetype=linux_secure "Invalid user"

[ssh_auth_failure_pam]
search = sourcetype=linux_secure "authentication failure"

[ssh_sudo]
search = sourcetype=linux_secure "sudo:"
