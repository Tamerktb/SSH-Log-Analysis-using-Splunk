###############################################################################
# SSH Log Parser Macros
# Use in Splunk: Settings > Advanced Search > Search Macros
###############################################################################

[ssh_failed_logins(threshold)]
definition = index=linux_secure sourcetype=linux_secure "Failed password" \
  | rex "Failed password for (?<target_user>\S+) from (?<src_ip>\S+)" \
  | stats count by src_ip, target_user \
  | where count >= $threshold$
iseval = 0

[ssh_successful_logins]
definition = index=linux_secure sourcetype=linux_secure "Accepted password" \
  | rex "Accepted password for (?<target_user>\S+) from (?<src_ip>\S+)"
iseval = 0

[ssh_all_attempts]
definition = index=linux_secure sourcetype=linux_secure \
  | rex "((?<event_type>Accepted|Failed) password for (?<target_user>\S+) from (?<src_ip>\S+))" \
  | search event_type=*
iseval = 0

[ssh_geo_enrich]
definition = lookup geoip src_ip OUTPUT city, country, lat, lon, is_anonymous_proxy
iseval = 0

[ssh_threat_score(count)]
definition = eval threat_score = case( \
    $count$ >= 50, "CRITICAL", \
    $count$ >= 20, "HIGH", \
    $count$ >= 10, "MEDIUM", \
    $count$ >= 5, "LOW" \
  )
iseval = 0

[ssh_off_hours]
definition = eval login_hour = strftime(_time, "%H") \
  | eval login_dow = strftime(_time, "%u") \
  | where login_hour < 7 OR login_hour > 19 OR login_dow >= 6
iseval = 0
