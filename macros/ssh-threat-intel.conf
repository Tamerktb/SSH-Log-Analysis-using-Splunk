###############################################################################
# SSH Threat Intelligence Macros
# Use in Splunk: Settings > Advanced Search > Search Macros
###############################################################################

[ssh_lookup_attackers]
definition = lookup known_attackers.csv src_ip OUTPUTGROUP attack_details
iseval = 0

[ssh_high_risk_countries]
definition = where lower(country) IN ("russia", "china", "north korea", "iran", "syria", "nigeria")
iseval = 0

[ssh_impossible_travel]
definition = | streamstats time_window=1h values(lat) as prev_lat, values(lon) as prev_lon, \
    values(src_city) as prev_city by target_user \
  | eval distance_km = sqrt(pow((lat - prev_lat) * 111.32, 2) + pow((lon - prev_lon) * 111.32 * cos(lat * 3.14159 / 180), 2)) \
  | eval time_diff_hours = (_time - prev_time) / 3600 \
  | eval required_speed = if(time_diff_hours > 0, distance_km / time_diff_hours, 0) \
  | where required_speed > 900
iseval = 0

[ssh_first_time_login]
definition = eventstats values(src_ip) as historical_ips, values(city) as historical_cities by target_user \
  | eval is_new_ip = if(mvfind(historical_ips, src_ip) < 0, true, false) \
  | eval is_new_city = if(mvfind(historical_cities, city) < 0, true, false) \
  | where is_new_ip = true OR is_new_city = true
iseval = 0

[ssh_concurrent_sessions]
definition = bucket _time span=1m \
  | stats dc(src_ip) as active_sessions by target_user, _time \
  | where active_sessions >= 3
iseval = 0
