###############################################################################
# Splunk Transforms Configuration - SSH Field Extraction
# Place in: $SPLUNK_HOME/etc/system/local/transforms.conf
#
# Defines regex-based field extractions for SSH authentication events.
###############################################################################

[ssh_event_types]
REGEX = (Failed|Accepted|Invalid|Connection closed|Disconnected|break-in)
FORMAT = ssh_event_type::$1

[ssh_auth_extract]
REGEX = (Failed\s+password\s+for\s+(?:invalid\s+user\s+)?(?<ssh_user>\S+)\s+from\s+(?<ssh_src_ip>\S+)\s+port\s+(?<ssh_port>\d+)|Accepted\s+(?<ssh_auth_method>\S+)\s+for\s+(?<ssh_user_accepted>\S+)\s+from\s+(?<ssh_src_ip_accepted>\S+)\s+port\s+(?<ssh_port_accepted>\d+))
FORMAT = ssh_user::"$1" ssh_src_ip::"$2" ssh_port::"$3"

[ssh_search_fields]
REGEX = (?i)(?:(?<ssh_event>Failed|Accepted)\s+password\s+for\s+(?:invalid\s+user\s+)?(?<ssh_user>[^\s]+)\s+from\s+(?<ssh_src_ip>[^\s]+)\s+port\s+(?<ssh_port>\d+)|(?<ssh_auth_result>Accepted)\s+(?<ssh_auth_method>\S+)\s+for\s+(?<ssh_user>[^\s]+)\s+from\s+(?<ssh_src_ip>[^\s]+)\s+port\s+(?<ssh_port>\d+))
FORMAT = ssh_event_type::"ssh_event" ssh_user::"ssh_user" ssh_src_ip::"ssh_src_ip" ssh_port::"ssh_port"

[geoip-cities]
REGEX = ^
LOOKUP_METHOD = geoip
EXTRACT_output = city, country, lat, lon
