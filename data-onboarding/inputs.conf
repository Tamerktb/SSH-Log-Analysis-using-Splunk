###############################################################################
# Splunk Universal Forwarder Inputs Configuration
# Place in: $SPLUNK_HOME/etc/system/local/inputs.conf
#
# Monitors SSH authentication logs on Linux systems for real-time ingestion.
# Tested on: Ubuntu (auth.log), RHEL/CentOS (secure)
###############################################################################

[monitor:///var/log/auth.log]
disabled = 0
index = linux_secure
sourcetype = linux_secure
crcSalt = <SOURCE>
followTail = 0

[monitor:///var/log/secure]
disabled = 0
index = linux_secure
sourcetype = linux_secure
crcSalt = <SOURCE>
followTail = 0

[monitor:///var/log/syslog]
disabled = 1
index = linux_syslog
sourcetype = syslog
crcSalt = <SOURCE>
followTail = 0

[monitor:///var/log/messages]
disabled = 1
index = linux_messages
sourcetype = syslog
crcSalt = <SOURCE>
followTail = 0

# === Resource Limits ===
[default]
host = $decideOnStartup
_meta = ssh_source::forwarder
