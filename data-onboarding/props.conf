###############################################################################
# Splunk Props Configuration - SSH Log Parsing
# Place in: $SPLUNK_HOME/etc/system/local/props.conf
#
# Defines line-breaking, timestamp extraction, and field extraction
# for SSH authentication logs.
###############################################################################

[linux_secure]
# Timestamp extraction
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000

# Extract hostname from syslog format
EXTRACT-host = ^\S+\s+\d+\s+\d{2}:\d{2}:\d{2}\s+(?<hostname>\S+)

# SSH event type classification
REPORT-ssh_events = ssh_event_types, ssh_auth_extract

# Segmentation rules
SEGMENTATION = indexing
SEGMENTATION-all_ssh = (Failed|Accepted|Invalid|Connection|Disconnected|Received|Did not receive)
BREAK_ONLY_BEFORE = (^\S+\s+\d+\s+\d{2}:\d{2}:\d{2})

# Performance tuning
KV_MODE = none
LEARN_SOURCETYPE = false
AUTO_KV_JSON = false

[linux_secure:search]
# Search-time field extraction (can be heavier)
REPORT-ssh_search_extract = ssh_search_fields

# Event type categorization
EVENTTYPE-ssh_failed = Failed password
EVENTTYPE-ssh_accepted = Accepted password
EVENTTYPE-ssh_invalid = Invalid user
EVENTTYPE-ssh_breach = break-in attempt
EVENTTYPE-ssh_disconnect = Disconnected from
